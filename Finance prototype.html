    <div class="sk-grid">
      <div class="field"><label>SKU Code</label><input class="sk-sku" value="${sku.sku||''}" placeholder="WC-XXXX"/></div>
      <div class="field col-2"><label>Product Name <span class="req">*</span></label><input class="sk-prod" value="${sku.productName||''}" placeholder="e.g. Royal Scroll Wedding Card"/></div>
      <div class="field"><label>Quantity <span class="req">*</span></label><input type="number" class="sk-qty" value="${sku.qty??''}" min="1"/></div>
      <div class="field"><label>Rate / Unit <span class="req">*</span></label><div class="prefix-wrap"><span class="cur">₹</span><input type="number" class="sk-rate" value="${sku.rate??''}" step="0.01"/></div></div>
      <div class="field"><label>Selling / Unit <span class="req">*</span></label><div class="prefix-wrap"><span class="cur">₹</span><input type="number" class="sk-sell" value="${sku.sellingPrice??''}" step="0.01"/></div></div>
      <div class="field"><label>Packaging (flat)</label><div class="prefix-wrap"><span class="cur">₹</span><input type="number" class="sk-pack" value="${sku.packaging||0}"/></div></div>
    </div>
    <div class="pp-title">Additional charges <span class="hint">cost per piece · multiplied by quantity</span></div>
    <div class="pp-grid">${CHARGE_TYPES.map(t=>`<div class="pp-item"><label>${t}</label><div class="pp-in"><span class="cur">₹</span><input type="number" class="pp-input" data-charge="${t}" value="${chargeVal(sku,t)}" step="0.01" placeholder="0"/><span class="pp-tot" data-pptot>= ₹0</span></div></div>`).join('')}</div>
    <div class="sk-line"><span>Base <b data-l-base>₹0</b></span><span>Charges <b data-l-chg>₹0</b></span><span>Packaging <b data-l-pack>₹0</b></span><span>Line landing <b data-l-land>₹0</b></span><span>Line selling <b data-l-sell>₹0</b></span><span>Margin <b data-l-gm>0%</b></span></div>
  </div>`;
}
function vendorEntryForm(existing){
  const n=el('div');
  const initSkus=(existing&&existing.skus&&existing.skus.length)?existing.skus:[null];
  const dISO=d=>d?new Date(d).toISOString().slice(0,10):today.toISOString().slice(0,10);
  n.innerHTML=`
    <div class="m-head"><div><h3>${existing?'Edit Vendor Entry':'Add Vendor Entry'}</h3><p>Add one or more SKUs. Totals recalculate instantly.</p></div>
      <button class="x-btn" data-close><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="m-body">
      <div style="display:grid;grid-template-columns:1fr 260px;gap:22px;align-items:start">
        <div>
          <div class="form-grid">
            <div class="form-section-title">Order</div>
            <div class="field"><label>Vendor <span class="req">*</span></label><select id="f_vendor">${vendors.map(v=>`<option value="${v.id}" ${existing&&existing.vendorId===v.id?'selected':''}>${v.name}</option>`).join('')}</select></div>
            <div class="field"><label>Customer Order No <span class="req">*</span></label><input id="f_co" value="${existing?existing.coId:'ORD-'+pad(5200+orders.length,4)}" placeholder="ORD-0000"/><span class="err">Required</span></div>
            <div class="field"><label>Order Number <span class="req">*</span></label><input id="f_po" value="${existing?existing.id:'PO-2026-'+pad(1000+orders.length,4)}" placeholder="PO-2026-0000"/><span class="err">Required</span></div>
            <div class="field"><label>Ordered Date</label><input type="date" id="f_ord" value="${dISO(existing&&existing.ordered)}"/></div>
            <div class="field"><label>Received Date</label><input type="date" id="f_recv" value="${dISO(existing&&existing.receivedDate)}"/></div>
            <div class="field"><label>GST %</label><select id="f_gst">${[5,12,18,28].map(g=>`<option ${(existing?existing.gstPct:18)===g?'selected':''}>${g}</option>`).join('')}</select></div>
          </div>

          <div class="sku-head-row"><div class="form-section-title" style="border:none;padding:0;margin:0">SKUs / Line Items</div><button class="btn sm" id="addSku" type="button"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Add SKU</button></div>
          <div id="skuList">${initSkus.map((s,i)=>skuCardHTML(i,s)).join('')}</div>

          <div class="form-grid" style="margin-top:6px">
            <div class="form-section-title">Invoice, Delivery & Audit</div>
            <div class="field"><label>Invoice Number</label><input id="f_inv" value="${existing&&existing.invoiceNo?existing.invoiceNo:''}" placeholder="INV/…"/></div>
            <div class="field"><label>Created By</label><input value="Rahul Admin" readonly/></div>
            <div class="field"><label>Verified By</label><input value="—" readonly/></div>
            <div class="field col-3"><label>Remarks</label><textarea id="f_rem" placeholder="General notes for this entry…">${existing?(existing.remarks||''):''}</textarea></div>
            <div class="field col-3"><label>Delivery Note <span class="hint">shortages, damage or delays</span></label><textarea id="f_delnote" placeholder="Flag any issue with this delivery — e.g. short by 12 pieces, one carton damaged…">${existing?(existing.deliveryNote||''):''}</textarea></div>
          </div>
        </div>

        <div class="calc-summary card" style="padding:16px">
          <h3 style="font-size:13px;margin-bottom:8px">Live Cost Summary</h3>
          <div class="row"><span class="k">SKUs</span><span class="v" id="s_skus">0</span></div>
          <div class="row"><span class="k">Total Qty</span><span class="v" id="s_qty">0</span></div>
          <div class="row"><span class="k">Base</span><span class="v" id="s_total">₹0</span></div>
          <div class="row"><span class="k">Packaging</span><span class="v" id="s_pack">₹0</span></div>
          <div class="row"><span class="k">Additional charges</span><span class="v" id="s_addl">₹0</span></div>
          <div class="row"><span class="k">Gross</span><span class="v" id="s_gross">₹0</span></div>
          <div class="row"><span class="k">GST</span><span class="v" id="s_gst">₹0</span></div>
          <div class="row total"><span class="k">Landing Cost</span><span class="v" id="s_landing">₹0</span></div>
          <div class="margin-badge"><div class="m-val" id="s_margin">0.0%</div><div class="m-lbl">Gross Margin</div></div>
          <div class="row" style="margin-top:10px"><span class="k">Gross Profit</span><span class="v" id="s_gp">₹0</span></div>
          <div class="row"><span class="k">Landing / unit</span><span class="v" id="s_lpu">₹0</span></div>
        </div>
      </div>
    </div>
    <div class="m-foot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="saveEntry">${existing?'Save Changes':'Create Entry'}</button></div>`;
  const m=openModal(n,'lg');

  function readSkus(){
    return $$('.sku-card',m).map(card=>({
      sku:$('.sk-sku',card).value.trim(),
      productName:$('.sk-prod',card).value.trim(),
      qty:+$('.sk-qty',card).value||0,
      rate:+$('.sk-rate',card).value||0,
      sellingPrice:+$('.sk-sell',card).value||0,
      packaging:+$('.sk-pack',card).value||0,
      charges:$$('.pp-input',card).map(inp=>({type:inp.dataset.charge,perPiece:+inp.value||0})).filter(c=>c.perPiece>0),
      _card:card
    }));
  }
  function renumber(){$$('.sku-card',m).forEach((c,i)=>{$('.sk-head b',c).textContent='SKU '+(i+1);});}
  function recalc(){
    const skus=readSkus();
    skus.forEach(s=>{
      const cl=computeSku(s);const card=s._card;
      $('[data-l-base]',card).textContent=INR(cl.base);
      $('[data-l-chg]',card).textContent=INR(cl.chargeSum);
      $('[data-l-pack]',card).textContent=INR(cl.packaging);
      $('[data-l-land]',card).textContent=INR(cl.lineGross);
      $('[data-l-sell]',card).textContent=INR(cl.sell);
      $('[data-l-gm]',card).textContent=PCT(cl.lineGm);
      $$('.pp-input',card).forEach(inp=>{const pp=+inp.value||0;$('[data-pptot]',inp.closest('.pp-in')).textContent='= '+INR(round2(pp*s.qty));});
    });
    const gstPct=+$('#f_gst',m).value||0;
    const c=computeEntry({skus:skus.map(({_card,...s})=>s),gstPct});
    $('#s_skus',m).textContent=skus.length;
    $('#s_qty',m).textContent=c.qty;
    $('#s_total',m).textContent=INR(c.total);
    $('#s_pack',m).textContent=INR(c.packaging);
    $('#s_addl',m).textContent=INR(round2(c.chargeSum));
    $('#s_gross',m).textContent=INR(c.gross);
    $('#s_gst',m).textContent=INR(c.gstAmt);
    $('#s_landing',m).textContent=INR(c.landing);
    $('#s_gp',m).textContent=INR2(c.gp);
    $('#s_lpu',m).textContent=INR2(c.landingPerUnit);
    $('#s_margin',m).textContent=PCT(c.gm);
  }

  m.addEventListener('input',recalc);
  m.addEventListener('click',e=>{
    const rm=e.target.closest('[data-remove]');
    if(rm){const cards=$$('.sku-card',m);if(cards.length<=1){toast('At least one SKU','An entry needs at least one SKU line');return;}rm.closest('.sku-card').remove();renumber();recalc();}
  });
  $('#addSku',m).onclick=()=>{
    const idx=$$('.sku-card',m).length;
    const wrap=el('div');wrap.innerHTML=skuCardHTML(idx,null);
    $('#skuList',m).appendChild(wrap.firstElementChild);
    recalc();
  };
  recalc();

  $('#saveEntry',m).onclick=()=>{
    let ok=true;
    const mark=(inp,bad)=>{const f=inp&&inp.closest('.field');if(f)f.classList.toggle('invalid',bad);if(bad)ok=false;};
    const orderNo=$('#f_po',m).value.trim();
    const coNo=$('#f_co',m).value.trim();
    mark($('#f_co',m),!coNo);mark($('#f_po',m),!orderNo);
    const skus=readSkus();
    skus.forEach(s=>{
      mark($('.sk-prod',s._card),!s.productName);
      mark($('.sk-qty',s._card),!(s.qty>0));
      mark($('.sk-rate',s._card),!(s.rate>0));
      mark($('.sk-sell',s._card),!(s.sellingPrice>0));
    });
    if(!ok){toast('Check the form','Fill required fields marked with *');return;}
    const gstPct=+$('#f_gst',m).value||0;
    const cleanSkus=skus.map(({_card,...s})=>({...s,sku:s.sku||'WC-'+rint(1,99)}));
    const c=computeEntry({skus:cleanSkus,gstPct});
    const common={coId:coNo,vendorId:$('#f_vendor',m).value,skus:cleanSkus,gstPct,...c,
      sku:cleanSkus[0].sku,productName:cleanSkus[0].productName,
      invoiceNo:$('#f_inv',m).value||null,remarks:$('#f_rem',m).value,deliveryNote:$('#f_delnote',m).value,modifiedDate:today};
    if(existing){
      const oldId=existing.id;
      Object.assign(existing,common,{id:orderNo});
      if(orderNo!==oldId){delete omap[oldId];omap[orderNo]=existing;}
      recomputeVendor(existing.vendorId);
      closeModal();toast('Entry updated',orderNo+' recalculated');go(currentPage);
    }else{
      const rec={id:orderNo,...common,
        ordered:new Date($('#f_ord',m).value),expDelivery:new Date($('#f_ord',m).value),
        receivedDate:new Date($('#f_recv',m).value),status:'Received',
        adminApproval:'—',paymentStatus:'Unpaid',invoiceNo:common.invoiceNo||'INV/'+rint(1000,9999),
        invoiceDate:new Date($('#f_recv',m).value),dueDate:null,createdBy:'Rahul Admin',approver:'Rahul Admin',
        approvalDate:null,createdDate:today,locked:false,comments:[],notes:''};
      orders.unshift(rec);omap[rec.id]=rec;recomputeVendor(rec.vendorId);
      closeModal();toast('Entry created',rec.id+' added to vendor entries');go(currentPage);
    }
  };
}

/* ---- simple create modals ---- */
function createVendor(){
  const n=el('div');
  n.innerHTML=`<div class="m-head"><div><h3>Create Vendor</h3><p>Add a new card supplier to the master.</p></div><button class="x-btn" data-close><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <div class="m-body"><div class="form-grid" style="grid-template-columns:repeat(2,1fr)">
    <div class="field col-2"><label>Vendor Name <span class="req">*</span></label><input placeholder="Business name"/></div>
    <div class="field"><label>GST Number</label><input placeholder="22AAAAA0000A1Z5"/></div>
    <div class="field"><label>PAN</label><input placeholder="AAAAA0000A"/></div>
    <div class="field"><label>Contact Person</label><input/></div>
    <div class="field"><label>Phone</label><input placeholder="+91 …"/></div>
    <div class="field"><label>Email</label><input type="email"/></div>
    <div class="field"><label>Payment Terms</label><select>${PAYMENT_TERMS.map(t=>`<option>${t}</option>`).join('')}</select></div>
    <div class="field col-2"><label>Address</label><textarea></textarea></div>
  </div></div>
  <div class="m-foot"><button class="btn" data-close>Cancel</button><button class="btn primary" onclick="closeModal();toast('Vendor created','New vendor added to master')">Create Vendor</button></div>`;
  openModal(n);
}

/* ============================================================= *
 * 7. ROUTER + BOOT                                             *
 * ============================================================= */
const NAV=[
  {id:'dashboard',label:'Dashboard',icon:'<rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/>'},
  {id:'entries',label:'Vendor Entries',icon:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',badge:()=>orders.filter(o=>o.status==='Received').length},
  {id:'approval',label:'Payment Approval',icon:'<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',badge:()=>orders.filter(o=>['Pending Approval','Verified','Hold'].includes(o.status)).length},
  {id:'vendors',label:'Vendors',icon:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/>'},
  {id:'reports',label:'Reports',icon:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>'},
  {id:'analytics',label:'Analytics',icon:'<path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/>'},
  {id:'settings',label:'Settings',icon:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>'}
];
let currentPage='dashboard';
function buildNav(){
  const nav=$('#nav');nav.innerHTML='';
  nav.appendChild(el('div','group-label','Operations'));
  NAV.forEach((item,i)=>{
    if(item.id==='reports')nav.appendChild(el('div','group-label','Insights'));
    const a=el('a',item.id===currentPage?'active':'');
    const badge=item.badge?item.badge():0;
    a.innerHTML=`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">${item.icon}</svg><span>${item.label}</span>${badge?`<span class="badge">${badge}</span>`:''}`;
    a.onclick=()=>go(item.id);
    nav.appendChild(a);
  });
}
function go(id){
  currentPage=id;
  const item=NAV.find(n=>n.id===id)||NAV[0];
  $('#crumbs').innerHTML=`King of Cards<span class="sep">/</span><b>${item.label}</b>`;
  const view=$('#view');view.innerHTML='';view.appendChild(pages[id]());
  view.scrollTo?.(0,0);window.scrollTo(0,0);
  buildNav();
  if(window.innerWidth<=960)$('#sidebar').classList.remove('open');
}
window.go=go;window.newVendorEntry=newVendorEntry;window.createVendor=createVendor;
window.editPO=editPO;window.viewPO=viewPO;window.closeModal=closeModal;window.toast=toast;

// header wiring
function boot(){
  buildNav();go('dashboard');
  $('#topDate').textContent=today.toLocaleDateString('en-IN',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
  $('#menuToggle').onclick=()=>$('#sidebar').classList.toggle('open');
  $('#refreshBtn').onclick=()=>{const b=$('#refreshBtn');b.style.transition='transform .5s';b.querySelector('svg').style.transform='rotate(360deg)';setTimeout(()=>b.querySelector('svg').style.transform='',500);toast('Refreshed','Data synced just now');};
  $('#exportTop').onclick=()=>exportCSV('procurement_export.csv',orders,[
    {label:'PO',val:o=>o.id},{label:'Vendor',val:o=>vmap[o.vendorId].name},{label:'Product',val:o=>o.productName},
    {label:'Qty',val:o=>o.qty},{label:'Landing',val:o=>o.landing},{label:'Selling',val:o=>o.sellingPrice},
    {label:'Margin%',val:o=>o.gm},{label:'Status',val:o=>o.status}]);
  $('#notifBtn').onclick=()=>toast('Notifications',orders.filter(o=>o.status==='Pending Approval').length+' approvals awaiting review');
  // global search
  const gs=$('#globalSearch');
  document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==gs&&!/input|textarea|select/i.test(document.activeElement.tagName)){e.preventDefault();gs.focus();}});
  gs.addEventListener('keydown',e=>{
    if(e.key==='Enter'){
      const q=gs.value.trim().toLowerCase();if(!q)return;
      const hit=orders.find(o=>[o.id,o.coId,o.sku,o.productName,o.invoiceNo,vmap[o.vendorId].name].some(x=>String(x).toLowerCase().includes(q)));
      const vhit=vendors.find(v=>v.name.toLowerCase().includes(q));
      if(hit)viewPO(hit.id);else if(vhit)viewVendor(vhit.id);else toast('No results','Nothing matched “'+gs.value+'”');
    }
    if(e.key==='Escape')gs.blur();
  });
}
boot();
</script>
